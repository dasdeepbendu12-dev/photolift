name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push to a branch makes the in-flight run for that branch pointless.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests benchmarks

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # The image stack is where platform differences actually bite --
          # codecs, BLAS, float rounding -- so cover the other two OSes on one
          # Python rather than paying for the full 3x5 matrix.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries for OpenCV
        if: runner.os == 'Linux'
        # opencv-contrib-python links against GL and glib even when only ever
        # used headlessly. Without these the import fails with
        # "libGL.so.1: cannot open shared object file", which reads like a
        # broken install rather than a missing system package.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --cov=photolift --cov-report=term-missing

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine
      - run: python -m build
      - name: Check package metadata
        # Catches the README markup and metadata problems that PyPI rejects at
        # upload time -- better to fail here than after tagging a release.
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

