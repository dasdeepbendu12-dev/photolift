[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photolift"
version = "0.2.1"
description = "Upscale and enhance photographs: resolution, contrast, focus, lighting and colour."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Deepu" }]
keywords = [
    "image-enhancement", "super-resolution", "upscaling", "denoise",
    "deblur", "photography", "opencv",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.21",
    "opencv-contrib-python>=4.6",
    "pillow>=9.0",
]

[project.optional-dependencies]
ai = ["realesrgan>=0.3.0", "basicsr>=1.4.2", "torch>=1.13"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "build",
    "twine",
    # benchmarks/ only: sample photographs to degrade and score against.
    "scikit-image>=0.19",
]

[project.scripts]
photolift = "photolift.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/photolift"
Repository = "https://github.com/OWNER/photolift"
Issues = "https://github.com/OWNER/photolift/issues"
Changelog = "https://github.com/OWNER/photolift/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "B008",   # function call in default arg: never used that way here
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside functions deliberately, to keep each test's dependencies
# visible at its point of use rather than in a shared header.
"tests/*" = ["E402"]
"benchmarks/*" = ["E402"]

[tool.coverage.run]
source = ["photolift"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "if TYPE_CHECKING:",
]
